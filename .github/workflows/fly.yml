# World server on Fly.io (GDD §8.2). Off until the repository variable FLY_DEPLOY_ENABLED is
# "true" and the secret FLY_API_TOKEN holds a deploy token (`fly tokens create deploy`).
name: Deploy server to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.FLY_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
