# Static client on GitHub Pages (GDD §8.2). Off until the repository variable
# PAGES_DEPLOY_ENABLED is "true" and Settings -> Pages -> Source is "GitHub Actions".
# PENTAPOLIS_SERVER_URL points the client at the Fly.io server, e.g. https://pentapolis.fly.dev
name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.PAGES_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SERVER_URL: ${{ vars.PENTAPOLIS_SERVER_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
