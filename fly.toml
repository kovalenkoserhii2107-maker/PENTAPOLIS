# Fly.io Production Deployment Config for PENTAPOLIS (Single Authoritative Instance + SQLite WAL)
app = "pentapolis"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  PENTAPOLIS_DB_PATH = "/data/pentapolis.sqlite"

[mounts]
  source = "pentapolis_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
